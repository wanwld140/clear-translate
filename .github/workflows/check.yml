name: Check and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run check
      - run: npm test
      - run: python package-extension.py 清译_V5 --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: clear-translate-v5
          path: dist/清译_V5.zip
          if-no-files-found: error
